<style>
  @font-face {
    font-family: 'Twemoji Country Flags';
    unicode-range: U+1F1E6-1F1FF, U+1F3F4, U+E0062-E0063, U+E0065, U+E0067,

  }
  
  .m-flag, .popup-header h3, .it-title, .legend-item {

  }
</style>
<style>
  :root {
    --red: #d62828;
    --red-light: #fef2f2;
    --gray-50: #f9fafb;
    --gray-100: #f3f4f6;
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #1f2937;
    --role-exec: #2563eb;
    --role-board: #dc2626;
    --role-honor: #d97706;
    --role-trade: #16a34a;
    --role-special: #ea580c;
    --role-pres: #1e3a8a;
    --role-audit: #1f2937;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Twemoji Country Flags', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; }
  body { display: flex; flex-direction: column; background: #f4f5f7; color: var(--gray-900); }

  /* 로딩 화면 */
  .loading-overlay {
    position: fixed; inset: 0; z-index: 99999;
    background: white; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    transition: opacity 0.4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px; border: 4px solid var(--gray-200);
    border-top-color: var(--red); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--gray-700); font-size: 14px; font-weight: 600; }
  .loading-sub { color: var(--gray-500); font-size: 12px; }
  .error-box {
    background: #fee; border: 1px solid #fcc; padding: 16px 24px;
    border-radius: 8px; color: #c33; max-width: 500px; text-align: center;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 1000;
    border-bottom: 3px solid var(--red); flex-shrink: 0;
  }
  .title-block h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .title-block .sub-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 11px; align-items: center; }
  .sub { color: var(--gray-500); }
  .sub-divider { color: var(--gray-300); }
  .credit { color: var(--gray-500); }
  .credit strong { color: var(--red); font-weight: 700; }
  .ver-tag {
    display: inline-block; background: var(--red-light); color: var(--red);
    padding: 1px 7px; border-radius: 10px; font-size: 9px; font-weight: 700;
    border: 1px solid #fecaca;
  }
  .live-tag {
    display: inline-block; background: #dcfce7; color: #166534;
    padding: 1px 7px; border-radius: 10px; font-size: 9px; font-weight: 700;
    border: 1px solid #86efac; margin-left: 4px;
  }
  .live-tag::before { content: "●"; margin-right: 3px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  
  .header-stats { display: flex; gap: 10px; align-items: center; }
  .stat-pill {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 12px; border-radius: 6px; background: var(--gray-50);
    min-width: 60px; border: 1px solid var(--gray-200);
  }
  .stat-pill .num { font-size: 14px; font-weight: 700; color: var(--red); }
  .stat-pill .lbl { font-size: 9px; color: var(--gray-500); margin-top: 1px; white-space: nowrap; }

  .view-toggle {
    position: absolute; top: 16px; left: 16px;
    z-index: 999; background: white; padding: 4px;
    border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12);
    display: flex; gap: 2px;
  }
  .view-toggle button {
    border: none; background: transparent; padding: 7px 16px;
    cursor: pointer; font-size: 12px; font-weight: 600; color: var(--gray-500);
    border-radius: 6px; transition: all 0.15s;
  }
  .view-toggle button.active { background: var(--red); color: white; }
  .view-toggle button:hover:not(.active) { background: var(--gray-100); }

  .breadcrumb {
    position: absolute; top: 64px; left: 16px; z-index: 998;
    background: white; padding: 8px 14px; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none;
    align-items: center; gap: 8px; font-size: 12px;
  }
  .breadcrumb.show { display: flex; }
  .breadcrumb a { color: var(--red); text-decoration: none; cursor: pointer; font-weight: 600; }
  .breadcrumb .sep { color: var(--gray-300); }
  .breadcrumb .current { color: var(--gray-700); font-weight: 600; }

  .refresh-btn {
    position: absolute; top: 16px; right: 16px; z-index: 999;
    background: white; border: 1px solid var(--gray-200); padding: 6px 12px;
    border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.1);
    cursor: pointer; font-size: 11px; font-weight: 600; color: var(--gray-700);
    display: flex; align-items: center; gap: 5px;
  }
  .refresh-btn:hover { background: var(--gray-50); color: var(--red); }
  .refresh-btn.loading { pointer-events: none; opacity: 0.6; }
  .refresh-btn.loading svg { animation: spin 1s linear infinite; }

  main { flex: 1; display: flex; overflow: hidden; position: relative; }

  aside { width: 340px; background: white; border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .search-box { padding: 12px; border-bottom: 1px solid var(--gray-200); }
  .search-box input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--gray-300); border-radius: 6px;
    font-size: 13px; outline: none; transition: all 0.15s;
  }
  .search-box input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(214,40,40,.12); }

  .filter-section { border-bottom: 1px solid var(--gray-200); }
  .filter-header {
    padding: 10px 12px; font-size: 11px; font-weight: 700; color: var(--gray-700);
    text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--gray-50);
  }
  .filter-header:hover { background: var(--gray-100); }
  .filter-header .arrow { transition: transform 0.2s; font-size: 10px; }
  .filter-header.collapsed .arrow { transform: rotate(-90deg); }
  .filter-body { padding: 8px 12px 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .filter-body.collapsed { display: none; }
  .filter-chip {
    padding: 4px 10px; border-radius: 12px; background: var(--gray-100);
    font-size: 11px; cursor: pointer; border: 1px solid transparent;
    user-select: none; white-space: nowrap; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .filter-chip.active { background: var(--red); color: white; }
  .filter-chip:hover:not(.active) { background: var(--gray-200); }
  .filter-chip .cnt { opacity: 0.6; font-size: 10px; }
  .filter-chip .dot { width: 8px; height: 8px; border-radius: 50%; }

  .results-list { flex: 1; overflow-y: auto; padding: 4px; }
  .results-header {
    padding: 8px 12px; font-size: 11px; color: var(--gray-500);
    font-weight: 600; background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
  }
  .item {
    padding: 10px 12px; border-bottom: 1px solid var(--gray-100);
    cursor: pointer; transition: background 0.15s;
  }
  .item:hover { background: var(--red-light); }
  .item .it-title { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
  .item .it-sub { font-size: 11px; color: var(--gray-500); margin-top: 3px; }
  .item .it-meta { display: flex; gap: 6px; margin-top: 5px; font-size: 10px; flex-wrap: wrap; }
  .badge { padding: 1px 6px; border-radius: 8px; font-weight: 600; }
  .badge-pres { background: #dbeafe; color: #1e40af; }
  .badge-vac { background: #fee2e2; color: #b91c1c; }
  .badge-mem { background: var(--gray-100); color: var(--gray-700); }
  .badge-region { color: white; }

  #map { flex: 1; }

  .map-marker {
    border-radius: 50%; border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700;
    transition: transform 0.15s; cursor: pointer;
  }
  .map-marker:hover { transform: scale(1.12); }
  .map-marker.region {
    border-width: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    flex-direction: column; padding: 6px;
    text-align: center; line-height: 1.1;
  }
  .map-marker.region .r-name { font-size: 12px; font-weight: 800; letter-spacing: -0.3px; }
  .map-marker.region .r-chap { font-size: 10px; opacity: 0.9; margin-top: 3px; font-weight: 600; }
  .map-marker.region .r-mem { font-size: 15px; font-weight: 800; margin-top: 2px; letter-spacing: -0.5px; }
  .map-marker.chapter.vacant { background: #94a3b8; }
  .map-marker.chapter.unofficial { background: #fbbf24; color: #78350f; }

  .leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; padding: 0; min-width: 300px; max-width: 400px; }
  .popup-content { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
  .popup-header { padding: 12px 14px; color: white; }
  .popup-header h3 { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
  .popup-header .sub { font-size: 11px; opacity: 0.9; color: white; }
  .popup-body { padding: 12px 14px; max-height: 460px; overflow-y: auto; }
  .popup-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .popup-stat { background: var(--gray-50); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--gray-200); }
  .popup-stat .num { font-size: 18px; font-weight: 700; color: var(--gray-900); line-height: 1; }
  .popup-stat .lbl { font-size: 10px; color: var(--gray-500); margin-top: 3px; }
  .popup-info-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--gray-100); }
  .popup-info-row .lbl { color: var(--gray-500); }
  .popup-info-row .val { color: var(--gray-900); font-weight: 600; }
  .popup-section-title {
    font-size: 11px; font-weight: 700; color: var(--gray-700);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 12px 0 6px;
  }
  .popup-cat-bar { display: flex; flex-wrap: wrap; gap: 4px; }
  .popup-cat-tag { padding: 2px 8px; border-radius: 8px; font-size: 10px; color: white; font-weight: 600; }

  .popup-member {
    padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
    background: white; border: 1px solid var(--gray-200);
    border-radius: 6px; border-left: 3px solid var(--gray-200);
  }
  .popup-member.has-role { border-left-color: var(--gray-400); }
  .m-line1 { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .m-flag { display: inline-flex; align-items: center; line-height: 1; }
  .m-flag img.flag-img { border-radius: 2px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.1); }
  .flag-img { vertical-align: middle; border-radius: 2px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.1); }
  .m-name { font-weight: 700; color: var(--gray-900); font-size: 13px; }
  .role-tag {
    display: inline-block; padding: 1px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 700; color: white;
    line-height: 1.6; white-space: nowrap;
  }
  .role-pres { background: var(--role-pres); }
  .role-board { background: var(--role-board); }
  .role-director { background: #6366f1; }  /* 상임이사: 인디고 */
  .role-exec { background: var(--role-exec); }
  .role-honor { background: var(--role-honor); }
  .role-trade { background: var(--role-trade); }
  .role-special { background: var(--role-special); }
  .role-audit { background: var(--role-audit); }
  .m-company { font-size: 11px; color: var(--gray-700); margin-top: 3px; }
  .m-industry { font-size: 10px; color: var(--gray-500); margin-top: 1px; }
  .m-cat-line { font-size: 10px; color: var(--gray-500); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .m-cat-tag {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    font-size: 9px; font-weight: 700; color: white;
  }
  .m-recommend {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    color: #92400e; border: 1px solid #fcd34d;
    margin-top: 3px;
  }
  .m-email { font-size: 10px; color: var(--role-exec); margin-top: 3px; word-break: break-all; }
  .m-email a { color: var(--role-exec); text-decoration: none; }
  .m-email a:hover { text-decoration: underline; }

  .popup-action {
    display: block; width: 100%; padding: 8px;
    background: var(--red); color: white; border: none;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    margin-top: 10px;
  }

  .legend {
    position: absolute; left: 16px; bottom: 16px; z-index: 998;
    background: white; border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,.15); font-size: 11px;
    max-width: 240px; overflow: hidden;
    transition: all 0.25s;
  }
  .legend-header {
    padding: 8px 14px; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .legend-title { font-weight: 700; color: var(--gray-700);
    text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
  .legend-arrow { font-size: 10px; transition: transform 0.2s; color: var(--gray-500); }
  .legend.collapsed .legend-arrow { transform: rotate(-90deg); }
  .legend-body {
    padding: 0 14px 10px;
    max-height: 400px; overflow-y: auto;
    transition: max-height 0.25s, padding 0.25s;
  }
  .legend.collapsed .legend-body { max-height: 0; padding-top: 0; padding-bottom: 0; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: pointer; }
  .legend-item:hover { color: var(--red); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .lang-switcher {
    display: flex; gap: 4px; margin-right: 10px;
  }
  .lang-pill {
    min-width: 26px; height: 24px; padding: 0 7px;
    border: 1.5px solid var(--gray-200); background: white;
    border-radius: 5px; cursor: pointer;
    font-size: 11px; font-weight: 700;
    color: var(--gray-500);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif;
    line-height: 1;
  }
  .lang-pill:hover {
    background: var(--gray-50);
    color: var(--gray-800);
    border-color: var(--gray-300);
    transform: translateY(-1px);
  }
  .lang-pill.active {
    color: white;
    border-color: transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  /* 언어별 active 색상 (각 국가 대표 색상) */
  .lang-pill.active[data-lang="ko"] { background: #003478; }  /* 한국 - 진파랑 */
  .lang-pill.active[data-lang="en"] { background: #1f2937; }  /* 영어 - 검정/네이비 */
  .lang-pill.active[data-lang="zh"] { background: #de2910; }  /* 중국 - 빨강 */
  .lang-pill.active[data-lang="ja"] { background: #bc002d; }  /* 일본 - 빨강 */
  
  @media (max-width: 768px) {
    /* 헤더 컴팩트하게 */
    header { padding: 6px 10px; }
    header > div:first-child { gap: 6px; flex: 1; min-width: 0; }
    .title-block h1 { font-size: 12px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title-block .ver-tag { display: none; }
    .title-block .sub-line { display: none; }  /* 부제/크레딧 숨김 (자리 너무 차지) */
    
    /* 사이드바 - 햄버거 메뉴 */
    aside { position: absolute; left: -100%; top: 0; bottom: 0; z-index: 998;
            box-shadow: 4px 0 16px rgba(0,0,0,.15); transition: left 0.25s; }
    aside.open { left: 0; }
    
    /* 헤더 통계 - 2개만 표시, 더 작게 */
    .header-stats { gap: 4px; flex-shrink: 0; }
    .header-stats .stat-pill { padding: 3px 6px; min-width: 42px; }
    .header-stats .stat-pill .num { font-size: 12px; }
    .header-stats .stat-pill .lbl { font-size: 8px; }
    .header-stats .stat-pill:nth-child(n+3) { display: none; }
    
    /* 햄버거 버튼 작게 */
    .menu-btn { display: block !important; padding: 4px 6px; font-size: 16px; }
    
    /* 언어 버튼 - 매우 작게 */
    .lang-switcher { gap: 2px; margin-right: 4px; flex-shrink: 0; }

// ============================================================
// 정규화 함수
// ============================================================
function norm(s) {
  return String(s || '').toLowerCase().replace(/[\s./'-]/g, '');
}

function normCountry(c) {
  if (!c) return '';
  const s = String(c).trim();
  return META.countryAliases[s] || (s === s.toUpperCase() ? s.charAt(0) + s.slice(1).toLowerCase() : s);
}

function normCity(c) {
  if (!c) return '';
  const s = String(c).trim();
  return META.cityAliases[s] || s;
}

function getRegion(country, city) {
  let region = META.countryRegion[country] || '';
  if (country === 'USA') {
    const east = ['New York','New Jersey','Atlanta','Boston','Chicago','Dallas','Detroit','Houston','Washington D.C.','Miami','Savannah','Fort Lee','Tampa','San Juan','Raleigh','Fairfax'];
    const west = ['Los Angeles','San Francisco','Seattle','San Diego','Denver','Las Vegas'];
    if (east.includes(city)) return '북미주동부';
    if (west.includes(city)) return '북미주서부';
    if (city === 'Guam') return '아시아';
    return '북미주동부';
  }
  if (country === 'Canada') {
    const east = ['Toronto','Windsor','Montreal'];
    return east.includes(city) ? '북미주동부' : '북미주서부';
  }
  return region;
}

function getCoord(country, city) {
  if (META.cityCoords[country] && META.cityCoords[country][city]) {
    return META.cityCoords[country][city];
  }
  return null;
}

// ============================================================
// 업종 → 카테고리 자동 분류
// ============================================================
function categorize(industry) {
  if (!industry) return null;
  const text = String(industry);
  const matched = [];
  
  if (text.includes('종합무역')) matched.push('종합무역');
  
  for (const [cat, keywords] of Object.entries(META.categoryKeywords)) {
    for (const kw of keywords) {
      if (text.includes(kw)) {
        if (!matched.includes(cat)) matched.push(cat);
        break;
      }
    }
  }
  
  if (matched.length === 0) {
    if (text.includes('서비스')) return '서비스업';
    return '기타';
  }
  return matched.join(' / ');
}

function primaryCategory(cat) {
  if (!cat) return null;
  const parts = cat.split(' / ');
  for (const p of parts) {
    if (p !== '종합무역') return p;
  }
  return parts[0];
}

// 특별위원장 번호 제거
function cleanPosition(pos) {
  if (!pos) return '';
  return String(pos).replace(/(\d+)\.\s*/g, '').trim();
}

// ============================================================
// CSV 파싱
// ============================================================
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = '';
  let inQuote = false;
  
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      if (ch === '"') {
        if (text[i+1] === '"') { cur += '"'; i++; }
        else { inQuote = false; }
      } else {
        cur += ch;
      }
    } else {
      if (ch === '"') inQuote = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.length > 1 || row[0]) rows.push(row);
        row = [];
      } else cur += ch;
    }
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// ============================================================
// 시트 데이터 → 지회 그룹화
// ============================================================
function buildChaptersFromSheet(rows) {
  if (rows.length < 2) throw new Error('시트가 비어있음');
  
  const headers = rows[0].map(h => h.trim());
  const idx = {
    no: headers.indexOf('번호'),
    country: headers.indexOf('국가'),
    region: headers.indexOf('권역'),
    chapter: headers.indexOf('지회'),
    name: headers.indexOf('성명'),
    position: headers.indexOf('23대 임원 직책'),
    president: headers.indexOf('지회장'),
    honorary: headers.indexOf('명예회장'),
    director: headers.indexOf('상임이사여부'),
    industry: headers.indexOf('업종'),
    company: headers.indexOf('회사명'),
    email: headers.indexOf('이메일'),
  };
  
  document.getElementById('loadingSub').textContent = `${rows.length - 1}개 행 처리 중...`;
  
  // 공식 지회 미리 등록 (회원 0명이어도 표시)
  const chapters = [];
  const chapterMap = new Map();
  
  for (const key of META.officialChapters) {
    const [country, city] = key.split('|');
    const coord = getCoord(country, city);
    if (!coord) continue;
    const region = META.officialRegions[key] || getRegion(country, city);
    const ch = {
      country, city, region,
      lat: coord[0], lng: coord[1],
      iso: DATA.countryIso[country] || '',
      official: true, members: [], president: null,
    };
    chapters.push(ch);
    chapterMap.set(`${norm(country)}|${norm(city)}`, ch);
  }
  
  // 회원 추가
  const chaptersWithPresident = new Set();
  
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length < 5) continue;
    
    const rawCountry = row[idx.country] || '';
    const rawCity = row[idx.chapter] || '';
    const country = normCountry(rawCountry);
    const city = normCity(rawCity);
    
    if (!country || !city || country === 'Korea' || city === '기타') continue;
    
    const key = `${norm(country)}|${norm(city)}`;
    let ch = chapterMap.get(key);
    
    // 비공식 지회
    if (!ch) {
      const coord = getCoord(country, city);
      if (!coord) continue;
      const region = getRegion(country, city);
      ch = {
        country, city, region,
        lat: coord[0], lng: coord[1],
        iso: DATA.countryIso[country] || '',
        official: false, members: [], president: null,
      };
      chapters.push(ch);
      chapterMap.set(key, ch);
    }
    
    // 카테고리 자동 분류
    const industry = (row[idx.industry] || '').trim();
    const categoryFull = categorize(industry);
    const category = primaryCategory(categoryFull);
    
    const presidentVal = (row[idx.president] || '').trim();
    const member = {
      name: (row[idx.name] || '').trim(),
      company: (row[idx.company] || '').trim(),
      industry: industry,
      category: category || '',
      isDirector: (row[idx.director] || '').trim() === 'Y',
      position: cleanPosition(row[idx.position] || ''),
      honorary: (row[idx.honorary] || '').trim(),
      role: presidentVal === '지회장' ? '지회장' : '',
      email: (row[idx.email] || '').trim(),
    };
    
    if (presidentVal === '지회장') {
      ch.president = member.name;
      chaptersWithPresident.add(key);
    } else if (presidentVal === '공석' && !ch.president) {
      ch.president = '공석';
    }
    
    ch.members.push(member);
  }
  
  // 공석 마킹
  for (const ch of chapters) {
    if (ch.official && !ch.president) ch.president = '공석';
  }
  
  return chapters;
}

let currentLang = localStorage.getItem('okta_lang') || 'ko';

function t(key, fallback) {
  const u = I18N.ui[key];
  if (u && u[currentLang]) return u[currentLang];
  return fallback || key;
}

function tCountry(en) {
  if (!en) return '';
  const c = I18N.countries[en];
  if (c && c[currentLang]) return c[currentLang];
  return en;
}

function tCity(en) {
  if (!en) return '';
  const c = I18N.cities[en];
  if (c && c[currentLang]) return c[currentLang];
  return en;
}

function tRegion(ko) {
  if (!ko) return '';
  const r = I18N.regions[ko];
  if (r && r[currentLang]) return r[currentLang];
  return ko;
}

function tCategory(ko) {
  if (!ko) return '';
  const c = I18N.categories[ko];
  if (c && c[currentLang]) return c[currentLang];
  return ko;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('okta_lang', lang);
  document.documentElement.lang = lang;
  applyI18nToStaticUI();
  
  // 언어 버튼 active 상태 업데이트 (lang-pill)
  document.querySelectorAll('.lang-pill').forEach(b => 
    b.classList.toggle('active', b.dataset.lang === lang));
  
  // 다시 렌더
  if (typeof render === 'function') render();
}

function applyI18nToStaticUI() {
  try {
    // 정적 UI 요소 다국어 적용
    const titleEl = document.querySelector('.title-block h1');
    if (titleEl) {
      const ver = titleEl.querySelector('.ver-tag');
      titleEl.innerHTML = t('title') + ' ';
      if (ver) titleEl.appendChild(ver);
    }
  
  // 통계 라벨
  const setLabel = (sel, key) => {
    const el = document.querySelector(sel);
    if (el) el.textContent = t(key);
  };
  
  // 통계 pill 라벨들
  document.querySelectorAll('.stat-pill').forEach((p, i) => {
    const lbl = p.querySelector('.lbl');
    if (!lbl) return;
    const keys = ['stat_members', 'stat_chapters', 'stat_countries', 'stat_presidents', 'stat_regions'];
    if (keys[i]) lbl.textContent = t(keys[i]);
  });
  
  // 검색 placeholder
  const search = document.getElementById('searchInput');
  if (search) search.placeholder = t('search_placeholder');
  
  // 필터 헤더
  const filterHeaders = document.querySelectorAll('.filter-header');
  if (filterHeaders[0]) filterHeaders[0].querySelector('span').textContent = t('filter_category');
  if (filterHeaders[1]) filterHeaders[1].querySelector('span').textContent = t('filter_status');
  
  // 뷰 토글 버튼
  document.querySelectorAll('.view-toggle button').forEach(btn => {
    if (btn.dataset.view === 'region') btn.textContent = t('view_region');
    else if (btn.dataset.view === 'chapter') btn.textContent = t('view_chapter');
  });
  
    // 범례 타이틀
    const legendTitle = document.querySelector('.legend-title');
    if (legendTitle) legendTitle.textContent = t('legend_title');
  } catch(e) {
    console.warn('[OKTA] i18n apply error (non-fatal):', e);
  }
}

function isoToFlag(iso) {
  if (!iso || iso.length !== 2) return '';
  // ISO → emoji codepoints
  const codePoints = iso.toLowerCase().split('').map(c => 0x1F1E6 + c.charCodeAt(0) - 'a'.charCodeAt(0));
  return String.fromCodePoint(...codePoints);
}

  const cp = code.split('').map(c => (0x1F1E6 + c.charCodeAt(0) - 'a'.charCodeAt(0)).toString(16)).join('-');
  const sz = size || 16;
  return `<img class="flag-img" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${cp}.svg" alt="${iso.toUpperCase()}" loading="lazy" style="width:${sz}px;height:auto;vertical-align:middle;display:inline-block">`;
}

function getRoleTags(member) {
  const tags = [];
  if (member.role === '지회장') tags.push({label: '지회장', cls: 'role-pres'});
  if (member.honorary) tags.push({label: '명예회장 ' + member.honorary, cls: 'role-honor'});
  if (member.position) {
    const parts = member.position.split(' / ');
    parts.forEach(p => {
      p = p.trim();
      if (!p) return;
      if (p.startsWith('이사장단(')) tags.push({label: p, cls: 'role-board'});
      else if (p.startsWith('상임집행부(')) tags.push({label: p, cls: 'role-exec'});
      else if (p === '감사') tags.push({label: '감사', cls: 'role-audit'});
      else if (/^\d+통상위원장/.test(p)) tags.push({label: p, cls: 'role-trade'});
      else if (p.includes('위원장') || p.includes('단장')) tags.push({label: p, cls: 'role-special'});
      else tags.push({label: p, cls: 'role-special'});
    });
  }
  // 상임이사: 다른 직책이 없을 때만 단독 표시 (직책자는 이미 상임이사임)
  if (member.isDirector && !member.position && !member.honorary && member.role !== '지회장') {
    tags.push({label: '상임이사', cls: 'role-director'});
  }
  return tags;
}

function sortMembers(members) {
  // 정렬 우선순위:
  // 0순위: 지회장
  // 1순위: 직책자 (이사장단/상임집행부/감사/통상위원장/특별위원장/명예회장)
  // 2순위: 상임이사 (직책 없이 상임이사 자격만 있는 회원)
  // 3순위: 일반 회원
  // 같은 그룹 내에서는 가나다순
  function getPriority(m) {
    if (m.role === '지회장') return 0;
    if (m.position || m.honorary) return 1;  // 직책자
    if (m.isDirector) return 2;  // 상임이사 (직책 없음)
    return 3;  // 일반 회원
  }
  return [...members].sort((a, b) => {
    const pa = getPriority(a);
    const pb = getPriority(b);
    if (pa !== pb) return pa - pb;
    return a.name.localeCompare(b.name, 'ko');
  });
}

  const allCat = document.createElement('div');

function renderRegionView() {
  markerLayer.clearLayers();
  const displayRegions = DATA.displayRegions || DATA.regions;
  displayRegions.forEach(r => {
    let memberCount = 0, chapterCount = 0, presCount = 0, vacantCount = 0;
    const countries = new Set();
    const subRegions = (r === '북미주') ? ['북미주서부','북미주동부'] : [r];
    DATA.chapters.forEach(c => {
      if (!subRegions.includes(c.region)) return;
      const cnt = getFilteredMemberCount(c);
      if (cnt === 0 && (state.category || state.search)) return;
      if (state.status === 'has-pres' && (!c.president || c.president === '공석')) return;
      if (state.status === 'vacant' && c.president !== '공석') return;
      if (state.status === 'unofficial' && c.official) return;
      memberCount += cnt; chapterCount += 1;
      if (c.president && c.president !== '공석') presCount++;
      if (c.president === '공석') vacantCount++;
      if (cnt > 0) countries.add(c.country);
    });
    if (memberCount === 0 && state.category) return;
    const view = DATA.regionViews[r];
    const lat = view ? view.lat : DATA.regionSummary[r].lat;
    const lng = view ? view.lng : DATA.regionSummary[r].lng;
    // 권역별 회원수에 따라 사이즈 (sqrt 매핑, 60 ~ 160px)
    // 기준: 1600명 = 160px, 130명 = 60px
    const sqMin = Math.sqrt(130);   // 최소 회원수 가정
    const sqMax = Math.sqrt(1700);  // 최대 회원수 가정
    const sqCur = Math.sqrt(Math.max(memberCount, 1));
    const ratio = Math.max(0, Math.min(1, (sqCur - sqMin) / (sqMax - sqMin)));
    const size = Math.round(60 + ratio * 100);  // 60 ~ 160px
    const color = RC[r] || '#d62828';
    const chapterLabel = currentLang === 'ko' ? `${chapterCount}개 지회` 
      : currentLang === 'zh' ? `${chapterCount}个分会`
      : currentLang === 'ja' ? `${chapterCount}支会`
      : `${chapterCount} ch.`;
    const html = `<div class="map-marker region" style="width:${size}px;height:${size}px;background:${color}">
      <div class="r-name">${escapeHTML(tRegion(r))}</div>
      <div class="r-chap">${chapterLabel}</div>
      <div class="r-mem">${memberCount.toLocaleString()}</div>
    </div>`;
    const marker = L.marker([lat, lng], {
      icon: L.divIcon({className: 'custom-marker', html: html, iconSize: [size, size], iconAnchor: [size/2, size/2]})
    }).addTo(markerLayer);
    marker.bindPopup(buildRegionPopup(r, {memberCount, chapterCount, presCount, vacantCount, countries: countries.size}), {maxWidth: 380});
  });
}

function buildRegionPopup(r, stats) {
  const color = RC[r];

  const subRegions = (r === '북미주') ? ['북미주서부','북미주동부'] : [r];
  DATA.chapters.forEach(c => {
    if (!subRegions.includes(c.region)) return;
    c.members.forEach(m => { if (m.category) catDist[m.category] = (catDist[m.category] || 0) + 1; });
  });
  const topCats = Object.entries(catDist).sort((a,b) => b[1]-a[1]).slice(0, 6);
  let html = `<div class="popup-content">
    <div class="popup-header" style="background:${color}">
      <h3>${escapeHTML(tRegion(r))}</h3>
      <div class="sub">${stats.chapterCount}${t('count_chapters')} · ${stats.countries}${t('count_active_countries')} · ${t('stat_members')} ${stats.memberCount.toLocaleString()}${t('count_members')}</div>
    </div>
    <div class="popup-body">
      <div class="popup-stats-grid">
        <div class="popup-stat"><div class="num">${stats.memberCount.toLocaleString()}</div><div class="lbl">${t('stat_members')}</div></div>
        <div class="popup-stat"><div class="num">${stats.chapterCount}</div><div class="lbl">${t('chapter_count')}</div></div>
        <div class="popup-stat"><div class="num">${stats.countries}</div><div class="lbl">${t('active_countries')}</div></div>
        <div class="popup-stat"><div class="num">${stats.presCount}</div><div class="lbl">${t('presidents_count')}</div></div>
      </div>`;
  if (stats.vacantCount > 0) {
    html += `<div class="popup-info-row"><span class="lbl">${t('vacant_count')}</span><span class="val" style="color:#dc2626">${stats.vacantCount}${t('vacant_chapters')}</span></div>`;
  }
  if (topCats.length > 0) {
    html += `<div class="popup-section-title">${t('main_industries')}</div><div class="popup-cat-bar">`;
    topCats.forEach(([cat, cnt]) => {
      const ccolor = DATA.categoryColors[cat] || '#94a3b8';
      html += `<span class="popup-cat-tag" style="background:${ccolor}">${escapeHTML(tCategory(cat))} ${cnt}</span>`;
    });
    html += `</div>`;
  }
  if (r === '북미주') {
    html += `<button class="popup-action" onclick="window._goNorthAmerica()">${t('view_north_america_chapters')}</button>`;
  } else {
    html += `<button class="popup-action" onclick="window._zoomTo('${escapeHTML(r)}')">${t('view_chapters_in').replace('{region}', escapeHTML(tRegion(r)))}</button>`;
  }
  html += `</div></div>`;
  return html;
}

function renderChapterView() {
  markerLayer.clearLayers();

  filtered.forEach(c => {
    const cnt = getFilteredMemberCount(c);
    if (cnt === 0 && state.category) return;
    let cls = 'chapter';
    let bg = RC[c.region] || '#d62828';
    if (c.president === '공석') { cls += ' vacant'; bg = '#94a3b8'; }
    else if (!c.official) { cls += ' unofficial'; bg = '#fbbf24'; }
    const size = Math.min(22 + Math.sqrt(cnt) * 3, 56);
    const html = `<div class="map-marker ${cls}" style="width:${size}px;height:${size}px;background:${bg};font-size:${cnt >= 100 ? 11 : 12}px">${cnt}</div>`;

      icon: L.divIcon({className: 'custom-marker', html: html, iconSize: [size, size], iconAnchor: [size/2, size/2]})
    }).addTo(markerLayer);

function buildChapterPopup(c) {
  const filteredMembers = state.category ? c.members.filter(m => m.category === state.category) : c.members;
  const sorted = sortMembers(filteredMembers);
  const catDist = {};
  c.members.forEach(m => { if (m.category) catDist[m.category] = (catDist[m.category] || 0) + 1; });
  let bg = RC[c.region] || '#d62828';
  let statusText = '';
  if (c.president === '공석') { bg = '#94a3b8'; statusText = t('vacant_label'); }
  else if (!c.official) { bg = '#f59e0b'; statusText = t('unofficial_chapter'); }
  else { statusText = `${t('president_label')}: ${c.president}`; }
  const chapterFlag = c.iso ? isoToFlagImg(c.iso, 20) : '';
  let html = `<div class="popup-content">
    <div class="popup-header" style="background:${bg}">
      <h3 style="display:flex;align-items:center;gap:8px">${chapterFlag}<span>${escapeHTML(tCity(c.city))}</span></h3>
      <div class="sub">${escapeHTML(tCountry(c.country))} · ${escapeHTML(tRegion(c.region))} · ${statusText}</div>
    </div>
    <div class="popup-body">
      <div class="popup-info-row"><span class="lbl">${t('db_members_count')}</span><span class="val">${c.members.length}${t('count_members')}</span></div>`;
  if (state.category) {
    html += `<div class="popup-info-row"><span class="lbl">${escapeHTML(tCategory(state.category))}</span><span class="val">${filteredMembers.length}${t('count_members')}</span></div>`;
  }
  if (Object.keys(catDist).length > 0) {
    html += `<div class="popup-section-title">${t('category_distribution')}</div><div class="popup-cat-bar">`;
    Object.entries(catDist).sort((a,b) => b[1]-a[1]).slice(0, 8).forEach(([cat, cnt]) => {
      const color = DATA.categoryColors[cat] || '#94a3b8';
      html += `<span class="popup-cat-tag" style="background:${color}">${escapeHTML(tCategory(cat))} ${cnt}</span>`;
    });
    html += `</div>`;
  }
  if (sorted.length > 0) {
    html += `<div class="popup-section-title">${t('db_members_count')} ${sorted.length}${t('count_members')}${state.category ? t('members_filtered') : ''}</div>`;
    const flag = isoToFlag(c.iso);
    sorted.forEach(m => {
      const tags = getRoleTags(m);
      const hasRole = tags.length > 0;
      html += `<div class="popup-member ${hasRole ? 'has-role' : ''}">`;
      html += `<div class="m-line1">`;
      if (c.iso) html += `<span class="m-flag" title="${escapeHTML(c.country)}">${isoToFlagImg(c.iso, 20)}</span>`;
      html += `<span class="m-name">${escapeHTML(m.name)}</span>`;
      tags.forEach(t => { html += `<span class="role-tag ${t.cls}">${escapeHTML(t.label)}</span>`; });
      html += `</div>`;
      if (m.company) html += `<div class="m-company">🏢 ${escapeHTML(m.company)}</div>`;
      if (m.industry) html += `<div class="m-industry">${escapeHTML(m.industry)}</div>`;
      if (m.category && m.category !== '기타' && m.category !== '서비스업') {
        const catColor = DATA.categoryColors[m.category] || '#94a3b8';
        const committee = DATA.categoryToCommittee[m.category];
        html += `<div class="m-cat-line">`;
        html += `<span class="m-cat-tag" style="background:${catColor}">${escapeHTML(tCategory(m.category))}</span>`;
        if (committee) {
          // 통상위원회 이름은 그대로 한국어 (옥타 공식 명칭)
          const recLabel = currentLang === 'ko' ? '💡 추천: ' 
            : currentLang === 'en' ? '💡 Rec: '
            : currentLang === 'zh' ? '💡 推荐: '
            : '💡 推奨: ';
          html += `<span class="m-recommend">${recLabel}${escapeHTML(committee.name)}</span>`;
        }
        html += `</div>`;
      }
      if (m.email) html += `<div class="m-email">✉ <a href="mailto:${escapeHTML(m.email)}">${escapeHTML(m.email)}</a></div>`;
      html += `</div>`;
    });
  }
  html += `</div></div>`;
  return html;
}

function getFilteredChapters() {
  return DATA.chapters.filter(c => {
    if (state.selectedRegion === '북미주') {
      if (c.region !== '북미주서부' && c.region !== '북미주동부') return false;
    } else if (state.selectedRegion && c.region !== state.selectedRegion) return false;
    if (state.status === 'has-pres' && (!c.president || c.president === '공석')) return false;
    if (state.status === 'vacant' && c.president !== '공석') return false;
    if (state.status === 'unofficial' && c.official) return false;
    if (state.category) {
      if (!c.members.some(m => m.category === state.category)) return false;
    }
    if (state.search) {
      const q = state.search.toLowerCase();
      const inName = c.city.toLowerCase().includes(q) || c.country.toLowerCase().includes(q);
      const inMember = c.members.some(m => 
        m.name.toLowerCase().includes(q) ||
        (m.company && m.company.toLowerCase().includes(q)) ||
        (m.email && m.email.toLowerCase().includes(q)));
      if (!inName && !inMember) return false;
    }
    return true;
  });
}

function getFilteredMemberCount(chapter) {
  if (!state.category) return chapter.members.length;
  return chapter.members.filter(m => m.category === state.category).length;
}

      item.innerHTML = `
        <div class="it-title"><span style="display:inline-flex;align-items:center;gap:6px">${listFlag}${escapeHTML(tCity(c.city))}</span><span class="badge badge-mem">${cnt}${t('count_members')}</span></div>
        <div class="it-sub">${escapeHTML(tCountry(c.country))}</div>
        <div class="it-meta">${regionBadge} ${badge}</div>`;
      item.onclick = () => {
        map.setView([c.lat, c.lng], 7, {animate: true});
        markerLayer.eachLayer(m => {
          const ll = m.getLatLng();
          if (Math.abs(ll.lat - c.lat) < 0.001 && Math.abs(ll.lng - c.lng) < 0.001) m.openPopup();
        });
        closeSidebarOnMobile();
      };
      list.appendChild(item);
    });
  }
}

window._goRegionView = function() {
  state.view = 'region'; state.selectedRegion = null;
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === 'region'));
  map.setView([20, 30], 2, {animate: true});
  render();
};

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'chapter' && state.selectedRegion === '북미주') {
    bc.innerHTML = `<a onclick="window._goRegionView()">${t('breadcrumb_world')}</a><span class="sep">›</span><span class="current">${tRegion('북미주')}</span>`;
    bc.classList.add('show');
  } else if (state.view === 'chapter' && state.selectedRegion) {
    bc.innerHTML = `<a onclick="window._goRegionView()">${t('breadcrumb_world')}</a><span class="sep">›</span><span class="current">${escapeHTML(tRegion(state.selectedRegion))}</span>`;
    bc.classList.add('show');
  } else if (state.view === 'chapter') {
    bc.innerHTML = `<a onclick="window._goRegionView()">${t('breadcrumb_world')}</a><span class="sep">›</span><span class="current">${t('breadcrumb_all_chapters')}</span>`;
    bc.classList.add('show');
  } else { bc.classList.remove('show'); }
}

function render() {
  if (!DATA) return;
  renderBreadcrumb();
  if (state.view === 'region' && !state.selectedRegion) renderRegionView();
  else renderChapterView();
  renderList();
  const filtered = getFilteredChapters();
  const totalMembers = filtered.reduce((s,c) => s + getFilteredMemberCount(c), 0);
  const countries = new Set();
  filtered.forEach(c => { if (getFilteredMemberCount(c) > 0) countries.add(c.country); });
  document.getElementById('statMembers').textContent = totalMembers.toLocaleString();
  document.getElementById('statChapters').textContent = filtered.length;
  document.getElementById('statCountries').textContent = countries.size;
  document.getElementById('statPres').textContent = filtered.filter(c => c.president && c.president !== '공석').length;
}

function escapeHTML(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value.trim();
    if (state.search && state.view === 'region') {
      state.view = 'chapter';
      document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === 'chapter'));
    }
    render();
  }, 200);
});

// 검색창에서 엔터 누르면 모바일에서 사이드바 닫기
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') closeSidebarOnMobile();
});

// 모바일 사이드바 토글 + 자동 닫기 헬퍼
const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
const closeSidebarOnMobile = () => {
  if (isMobile()) document.getElementById('sidebar').classList.remove('open');
};

document.getElementById('menuBtn').onclick = () => 
  document.getElementById('sidebar').classList.toggle('open');

// 사이드바 외부 클릭 시 닫기 (모바일)
document.addEventListener('click', (e) => {
  // 모바일 사이드바 외부 클릭 시 닫기
  if (isMobile()) {
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    if (sidebar.classList.contains('open')) {
      if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    }
  }
  
});

map.on('zoomend', () => {
  const z = map.getZoom();
  if (z >= 4 && state.view === 'region' && !state.selectedRegion) {
    state.view = 'chapter';
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === 'chapter'));
    render();
  } else if (z <= 2 && state.view === 'chapter' && !state.selectedRegion) {
    state.view = 'region';
    document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === 'region'));
    render();
  }
});

document.getElementById('legendHeader').onclick = () => {
  document.getElementById('legend').classList.toggle('collapsed');
};
if (window.matchMedia('(max-width: 768px)').matches) {
  document.getElementById('legend').classList.add('collapsed');
}

// 정적 모드 - 새로고침 불필요

// === 초기 로드 ===
(async function init() {
  try {
    DATA = await loadDataFromSheet();
    buildFilters();
    render();
    
    // 다국어 적용 (실패해도 페이지는 동작)
    try {
      const lastUpdateEl = document.getElementById('lastUpdate');
      if (lastUpdateEl) lastUpdateEl.textContent = t('subtitle');
      setLang(currentLang);
    } catch(e) {
      console.warn('[OKTA] i18n init warning:', e);
    }
    
    document.getElementById('loadingOverlay').classList.add('hidden');
    setTimeout(() => document.getElementById('loadingOverlay').remove(), 500);
  } catch (e) {
    console.error('[OKTA] Init error:', e);
    document.getElementById('loadingOverlay').innerHTML = `
      <div class="error-box" style="max-width:500px;text-align:center">
        <h3 style="margin-bottom:12px">⚠ 페이지 로드 오류</h3>
        <p style="font-size:13px;margin-bottom:16px;color:#c33;font-weight:600">${escapeHTML(e.message)}</p>
        <p style="font-size:11px;color:#888;margin-bottom:12px">F12 → Console에서 자세한 에러를 확인할 수 있습니다.</p>
        <button onclick="location.reload()" style="padding:8px 16px;background:#d62828;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600">다시 시도</button>
      </div>`;
  }
})();
</script>
